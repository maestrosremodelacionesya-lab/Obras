<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear cuenta</title>
<style>
:root{--ink:#14232b;--wall:#f3f4f2;--card:#fff;--line:#d3d8d4;--blue:#0f4c5c;--tape:#f2c230;--err:#b3261e;--ok:#1b6b3a}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--wall)}
.tape{height:34px;background:var(--tape);background-image:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 12px),repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 60px);background-size:100% 10px,100% 18px;background-repeat:repeat-x;background-position:left bottom}
main{max-width:440px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;line-height:1.15;margin:8px 0 4px}
.sub{margin:0 0 18px;color:#44545c}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-weight:600;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.roles{display:grid;gap:10px;margin-bottom:16px}
.role{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--card);font:inherit;color:var(--ink);cursor:pointer}
.role b{display:block;font-size:17px}
.role small{color:#44545c}
.role[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.ico{font-size:28px;width:40px;text-align:center}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--tape);outline-offset:1px;border-color:var(--blue)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:14px}
.chk input{width:22px;height:22px;margin:0;flex:none}
.go{width:100%;padding:16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.6}
.link{background:none;border:0;color:var(--blue);font:inherit;text-decoration:underline;padding:10px 0;cursor:pointer}
#msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600;display:none}
#msg.err{display:block;background:#fbe9e7;color:var(--err)}
#msg.ok{display:block;background:#e4f3ea;color:var(--ok)}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.go{transition:transform .1s}.go:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <h1 id="titulo">Crea tu cuenta</h1>
  <p class="sub" id="sub">Gratis. Elige cómo vas a usar la app.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-reg" aria-selected="true">Crear cuenta</button>
    <button role="tab" id="tab-ent" aria-selected="false">Entrar</button>
  </div>

  <form id="f" novalidate>
    <div id="bloque-reg">
      <div class="roles" role="group" aria-label="Tipo de cuenta">
        <button type="button" class="role" data-rol="cliente" aria-pressed="false"><span class="ico">🏠</span><span><b>Necesito una obra</b><small>Publico fotos y recibo cotizaciones</small></span></button>
        <button type="button" class="role" data-rol="profesional" aria-pressed="false"><span class="ico">🛠️</span><span><b>Soy profesional o empresa</b><small>Busco obras cerca y cotizo</small></span></button>
      </div>
      <label for="nombre" id="l-nombre">Nombre de usuario</label>
      <input id="nombre" autocomplete="nickname" placeholder="Solo este nombre se verá en el chat">
      <label for="ciudad">Ciudad o pueblo</label>
      <input id="ciudad" autocomplete="address-level2" placeholder="Ej: Bogotá, Medellín, Sopó">
    </div>

    <label for="correo">Correo</label>
    <input id="correo" type="email" autocomplete="email" inputmode="email">
    <label for="clave">Clave (mínimo 8 caracteres)</label>
    <input id="clave" type="password" autocomplete="new-password">

    <label class="chk hide" id="chk-wrap"><input type="checkbox" id="datos"><span>Autorizo el tratamiento de mis datos personales según la política de privacidad (Ley 1581 de 2012).</span></label>

    <button class="go" id="enviar" type="submit">Crear cuenta</button>
    <button class="link hide" id="olvido" type="button">Olvidé mi clave</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 1) Pega aquí los datos de tu proyecto (Supabase > Project Settings > API)
const SUPABASE_URL = "https://pdlqfuywmqubnlreqwkc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_81UvQuLGPU8UrlYg4H9rSw_oKK7vy0F";

const $ = id => document.getElementById(id);
let modo = "reg", rol = null, db = null;
try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) {}

function aviso(texto, tipo){ const m=$("msg"); m.className=tipo; m.textContent=texto; }
function limpiar(){ $("msg").className=""; $("msg").textContent=""; }

function setModo(m){
  modo = m; limpiar();
  const reg = m === "reg";
  $("tab-reg").setAttribute("aria-selected", reg);
  $("tab-ent").setAttribute("aria-selected", !reg);
  $("bloque-reg").classList.toggle("hide", !reg);
  $("chk-wrap").classList.toggle("hide", !reg);
  $("olvido").classList.toggle("hide", reg);
  $("titulo").textContent = reg ? "Crea tu cuenta" : "Entra a tu cuenta";
  $("sub").textContent = reg ? "Gratis. Elige cómo vas a usar la app." : "Usa el correo con el que te registraste.";
  $("enviar").textContent = reg ? "Crear cuenta" : "Entrar";
  $("clave").autocomplete = reg ? "new-password" : "current-password";
}
$("tab-reg").onclick = () => setModo("reg");
$("tab-ent").onclick = () => setModo("ent");

document.querySelectorAll(".role").forEach(b => b.onclick = () => {
  rol = b.dataset.rol;
  document.querySelectorAll(".role").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("l-nombre").textContent = rol === "profesional" ? "Nombre de tu empresa o de usuario" : "Nombre de usuario";
});

function traducir(msg){
  if (/already registered/i.test(msg)) return "Ese correo ya tiene cuenta. Toca Entrar.";
  if (/invalid login/i.test(msg)) return "Correo o clave incorrectos. Revisa e intenta de nuevo.";
  if (/not confirmed/i.test(msg)) return "Falta confirmar tu correo. Revisa tu bandeja y toca el enlace.";
  if (/rate limit|too many/i.test(msg)) return "Muchos intentos. Espera unos minutos e intenta de nuevo.";
  return "No pudimos completar la acción. Revisa tu conexión e intenta de nuevo.";
}

$("f").addEventListener("submit", async e => {
  e.preventDefault(); limpiar();
  if (!db || SUPABASE_URL.startsWith("PEGA")) return aviso("Falta pegar la URL y la clave anon de Supabase al inicio del archivo.", "err");
  const correo = $("correo").value.trim(), clave = $("clave").value;
  if (!/^\S+@\S+\.\S+$/.test(correo)) return aviso("Escribe un correo válido.", "err");
  if (clave.length < 8) return aviso("La clave debe tener mínimo 8 caracteres.", "err");
  $("enviar").disabled = true;
  try {
    if (modo === "reg") {
      const nombre = $("nombre").value.trim(), ciudad = $("ciudad").value.trim();
      if (!rol) throw {m:"Elige si necesitas una obra o si eres profesional."};
      if (nombre.length < 3) throw {m:"Escribe un nombre de usuario de al menos 3 letras."};
      if (!ciudad) throw {m:"Escribe tu ciudad o pueblo."};
      if (!$("datos").checked) throw {m:"Debes autorizar el tratamiento de datos para crear la cuenta."};
      const { data, error } = await db.auth.signUp({ email: correo, password: clave, options: { data: { rol, nombre, ciudad, acepto_datos: true } } });
      if (error) throw error;
      aviso(data.session ? "Cuenta creada. Ya puedes entrar." : "Cuenta creada. Revisa tu correo y toca el enlace para activarla.", "ok");
    } else {
      const { error } = await db.auth.signInWithPassword({ email: correo, password: clave });
      if (error) throw error;
      aviso("Listo, entraste a tu cuenta.", "ok");
    }
  } catch (err) {
    aviso(err.m || traducir(err.message || ""), "err");
  } finally { $("enviar").disabled = false; }
});

$("olvido").onclick = async () => {
  limpiar();
  const correo = $("correo").value.trim();
  if (!db || !correo) return aviso("Escribe tu correo arriba y toca de nuevo.", "err");
  const { error } = await db.auth.resetPasswordForEmail(correo);
  aviso(error ? traducir(error.message) : "Te enviamos un enlace para crear una clave nueva.", error ? "err" : "ok");
};
</script>
</body>
</html>
