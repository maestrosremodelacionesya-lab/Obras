<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestros Remodelaciones Ya</title>
<style>
:root{--ink:#14232b;--wall:#f3f4f2;--card:#fff;--line:#d3d8d4;--blue:#0f4c5c;--tape:#f2c230}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--wall)}
.tape{height:34px;background:var(--tape);background-image:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 12px);background-size:100% 10px;background-repeat:repeat-x;background-position:left bottom}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;line-height:1.15;margin:6px 0 6px}
.sub{margin:0 0 18px;color:#44545c}
a.go{display:block;text-align:center;padding:15px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;margin-top:12px}
a.sec{display:block;text-align:center;padding:14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:600;text-decoration:none;margin-top:12px}
a:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <h1>¡Listo! Tu cuenta quedó confirmada ✅</h1>
  <p class="sub">Ya puedes entrar. Elige qué quieres hacer.</p>
  <a class="go" href="publicar-obra.html">Publicar una obra</a>
  <a class="sec" href="mis-obras.html">Ver cotizaciones de mis obras</a>
  <a class="sec" href="obras-cercanas.html">Buscar obras para cotizar</a>
  <a class="sec" href="registro.html">Crear otra cuenta</a>
</main>
</body>
</html>
